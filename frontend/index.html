<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management Dashboard</title>
    <style>
      :root {
        --primary-gradient: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
        --primary-color: #6366f1;
        --bg-color: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border-color: #334155;
        --input-bg: #0f172a;
        --radius: 12px;
        --glow-color: rgba(99, 102, 241, 0.4);
        --glow-color-strong: rgba(168, 85, 247, 0.6);
      }

      body {
        font-family:
          "Inter",
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background-color: var(--bg-color);
        color: var(--text-main);
        margin: 0;
        padding: 40px 20px;
        -webkit-font-smoothing: antialiased;
      }

      .dashboard-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .dashboard-header h2 {
        font-size: 2rem;
        font-weight: 700;
        color: var(--text-main);
        margin: 0 0 10px 0;
        text-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
      }

      .header-bar {
        width: 60px;
        height: 4px;
        background: var(--primary-gradient);
        margin: 0 auto;
        border-radius: 2px;
        box-shadow: 0 0 15px var(--glow-color);
      }

      .dashboard-container {
        display: flex;
        gap: 30px;
        max-width: 1100px;
        margin: 0 auto;
        align-items: flex-start;
      }

      @media (max-width: 768px) {
        .dashboard-container {
          flex-direction: column;
        }
      }

      .form-panel,
      .table-panel {
        background: var(--card-bg);
        padding: 30px;
        border-radius: var(--radius);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border: 1px solid var(--border-color);
        transition:
          box-shadow 0.3s ease,
          transform 0.3s ease,
          border-color 0.3s ease;
      }

      .form-panel:hover,
      .table-panel:hover {
        box-shadow: 0 20px 40px -10px var(--glow-color);
        border-color: var(--primary-color);
      }

      .form-panel {
        flex: 1;
      }

      .table-panel {
        flex: 2;
        overflow-x: auto;
      }

      h3 {
        font-size: 1.25rem;
        font-weight: 600;
        margin-top: 0;
        margin-bottom: 24px;
        color: var(--text-main);
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 12px;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.875rem;
        color: var(--text-muted);
      }

      input {
        width: 100%;
        padding: 12px 14px;
        box-sizing: border-box;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 0.95rem;
        color: var(--text-main);
        transition: all 0.25s ease;
        background-color: var(--input-bg);
      }

      input:focus {
        outline: none;
        border-color: var(--primary-color);
        background-color: var(--card-bg);
        box-shadow: 0 0 15px var(--glow-color);
      }

      input::placeholder {
        color: #475569;
      }

      button {
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 12px 20px;
        border-radius: 8px;
        cursor: pointer;
        width: 100%;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.25s ease;
        box-shadow: 0 4px 20px var(--glow-color);
      }

      button:hover {
        opacity: 0.95;
        transform: translateY(-2px);
        box-shadow: 0 6px 25px var(--glow-color-strong);
      }

      button:active {
        transform: translateY(0);
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th,
      td {
        padding: 14px 16px;
        font-size: 0.9rem;
      }

      th {
        background-color: #0f172a;
        color: var(--text-muted);
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        border-bottom: 2px solid var(--border-color);
      }

      td {
        border-bottom: 1px solid var(--border-color);
        color: var(--text-main);
      }

      tbody tr {
        transition: background-color 0.15s ease;
      }

      tbody tr:hover {
        background-color: rgba(255, 255, 255, 0.02);
      }

      #studentTableBody:empty::after {
        content: "No students registered yet.";
        display: block;
        padding: 30px;
        text-align: center;
        color: var(--text-muted);
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <div class="dashboard-header">
      <h2>Student Management Dashboard</h2>
      <div class="header-bar"></div>
    </div>

    <div class="dashboard-container">
      <div class="form-panel">
        <h3>Add New Student</h3>
        <form id="studentForm">
          <div class="form-group">
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" placeholder="e.g. Viktor" />
          </div>
          <div class="form-group">
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" placeholder="e.g. Magtatanggol" />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="e.g. victormagtatangol@example.com"
            />
          </div>
          <button id="btn" type="submit">Submit Record</button>
        </form>
      </div>

      <div class="table-panel">
        <h3>Registered Students</h3>
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>First Name</th>
              <th>Last Name</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </div>

    <script src="app.js" type="module"></script>
  </body>
</html>
